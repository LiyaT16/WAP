<html>
  <head>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div class="m-10 h-80 w-90 rounded-md border-4 border-purple-400 p-4 align-middle">
      <h1 class="font border-purple-900 font-bold text-purple-700">An Important Alert</h1>
      <p class="test-xs my-2">Lorem ipsum dolor sit amet consectetur, adipisicing elit. Tempora distinctio repellat obcaecati quae consequuntur ex omnis atque sit quisquam fugiat quidem eaque, deserunt, quam, cumque error culpa assumenda fuga odio?</p>
      <button class="m-2 rounded border-2 border-purple-700 bg-purple-500 p-2">Confirm</button>
      <button class="m-2 rounded border-2 border-purple-600 p-2 text-purple-600">Cancel</button>
    </div>

    <div class="m-10 w-90 rounded-md border-4 border-purple-500 p-4 ">
  <form class="space-y-3.5 ">
    <label>Required field</label><br />
    <input type="text" placeholder="Required Field" class="w-full rounded border-2 border-purple-500" /> <br />
    <label>Disabled Field</label><br />
    <input type="text" placeholder="Disabled Field" class="w-full rounded border-2 border-purple-500 bg-purple-200" disabled /> <br />
    <label>Input Field</label><br />
    <input type="text" placeholder="Input Field" class="w-full rounded border-2 border-purple-500" />
    <input type="checkbox" class="accent-purple-700">
    <label>I accept the terms and conditions.</label>
    <div class="space-x-1">
      <button class="border-black-700 mt-5 rounded border-2 bg-purple-400 p-2">Submit</button>
      <button class="mt-5 rounded border-3 border-purple-700 p-2 text-purple-700">Reset</button>
      <button class="mt-5 rounded border-2 border-purple-500 p-2  disabled:opacity-50">Disabled</button>
    </div>
  </form>
</div>

  </body>
</html>
